# Land Units Template
#
# Recruitable land unit types for a nation's Order of Battle
# (see mvp/product/mvp-army-oob.md). Replace the example entries below
# with your nation's actual unit types; costs/upkeep use whatever
# in-game currency your nation's budget uses (see mvp-budget.md).
#
# type: infantry | mountain_infantry | elite_infantry | cavalry |
#       light_cavalry | artillery | support_weapons
# men / weapons: a unit type is measured by one or the other, never both.
#                artillery and support_weapons are counted in guns, so
#                their men is 0; every other type is counted in men, so
#                its weapons is 0.

land_units:
  # --- EXAMPLE ENTRIES — replace with your nation's actual unit types ---

  - name: Peasant Levy Battalion
    type: infantry
    description: Poorly equipped conscripts, cheap but unreliable in prolonged engagements
    recruit_cost: 500
    upkeep_per_turn: 50
    build_time_turns: 1
    men: 800
    weapons: 0

  - name: Line Infantry Regiment
    type: infantry
    description: Standing professional infantry, the backbone of the standing army
    recruit_cost: 1200
    upkeep_per_turn: 150
    build_time_turns: 2
    men: 1000
    weapons: 0

  - name: Alpine Rifle Battalion
