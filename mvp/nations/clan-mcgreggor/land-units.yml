# Clan McGreggor — Land Units
#
# Recruitable land unit types for Clan McGreggor's Order of Battle.
# Follows the schema defined in mvp/nations/template/land-units.yml.
# Currency: IP (Clan McGreggor's in-game currency, per this nation's budget).
#
# Note: men and weapons are mutually exclusive here. Artillery and
# support_weapons types are tracked by gun count only, so their men is 0;
# every other type is tracked by headcount only, so its weapons is 0.
#
# Entries marked PLACEHOLDER COSTS were added to cover units already
# fielded in army-oob.yml; their recruit cost, upkeep, and build time are
# rough guesses and need real values from the game's ruleset.

land_units:
  - name: Clan Levies
    type: infantry
    description: >-
      Mass infantry formations raised through traditional clan obligation
      rather than formal conscription. Warriors are drawn from farming
      communities, herding families, fishermen, and craftsmen. While formal
      training is limited, physical resilience and communal discipline are
      high. Trained in basic formation movement, volley fire, and holding
      ground under pressure — best suited to defensive roles, familiar
      terrain, or supporting elite units. Morale is reinforced by kinship
      ties and the presence of respected elders and champions; desertion is
      rare, as abandoning the field brings shame upon entire families. Clan
      Levies form the numerical backbone of Clan McGreggor armies.
    recruit_cost: 20
    upkeep_per_turn: 0.5
    build_time_turns: 1
    men: 1000
    weapons: 0

  - name: Highlanders
    type: mountain_infantry
    description: >-
      Light infantry specialists drawn from upland clans accustomed to
      steep terrain, harsh weather, and long movement without supply.
      Operate in loose formations, trained for skirmishing, ambush, and
      terrain dominance rather than formal line combat. Excel at delaying
      actions, securing high ground, and harassing enemy movements, relying
      on concealment, elevation, and movement discipline to bleed attackers
      and force engagements on unfavorable terms. Cohesion is maintained
      through shared hardship and strong clan identity, allowing these
      units to operate independently for extended periods.
    recruit_cost: 30
    upkeep_per_turn: 1
    build_time_turns: 1
    men: 500
    weapons: 0

  - name: Mounted Borders
    type: light_cavalry
    description: >-
      Light cavalry drawn from clans living along contested frontiers.
      These riders are experienced in raiding, skirmishing, and pursuit
      rather than shock combat. Operate in loose formations, striking
      flanks and supply lines before disengaging into broken terrain.
      Mounted Borders are trained to fight both mounted and dismounted,
      making them flexible tools in inter-clan warfare.
    recruit_cost: 35
    upkeep_per_turn: 2
    build_time_turns: 1
    men: 1000
    weapons: 0

  - name: Clan's Guard
    type: elite_infantry
    description: >-
      The inner martial core of Clan McGreggor. Warriors are selected from
      the strongest and most battle-proven fighters and sworn directly to
      the war chief. Training centers on the Highland Charge — a
      disciplined advance followed by ferocious close combat intended to
      shatter enemy cohesion. Members are experts with family claymores and
      hand axes and are conditioned to fight through casualties. The Clan's
      Guard is committed only at decisive moments to break enemy lines or
      hold critical ground at any cost.
    recruit_cost: 35
    upkeep_per_turn: 1
    build_time_turns: 1
    men: 500
    weapons: 0

  # --- PLACEHOLDER COSTS below — see note at top of file ---

  - name: Highlander Sharpshooters
    type: mountain_infantry
    description: >-
      Marksmen selected from the upland clans and issued smokeless-powder
      rifles well ahead of the rest of the army. Deployed in small numbers
      ahead of the Highlander battalions to pick off officers, gun crews,
      and scouts at ranges the line units cannot answer.
    recruit_cost: 45
    upkeep_per_turn: 2
    build_time_turns: 1
    men: 450
    weapons: 0

  - name: Garrison Infantry
    type: infantry
    description: >-
      Static troops raised to hold a fortified town and its works. Poorly
      suited to maneuver warfare and rarely moved from their assigned city,
      but cheap to maintain and reliable behind prepared defenses.
    recruit_cost: 15
    upkeep_per_turn: 0.4
    build_time_turns: 1
    men: 1000
    weapons: 0

  - name: Light Artillery Battery
    type: artillery
    description: >-
      Towed light field guns attached to brigades for direct support of an
      infantry advance. Mobile enough to keep pace with the line, but
      lacking the weight of shell to reduce fortifications.
    recruit_cost: 40
    upkeep_per_turn: 2
    build_time_turns: 1
    men: 0
    weapons: 20

  - name: Medium Artillery Battery
    type: artillery
    description: >-
      Heavier towed guns held at army level and allocated where the weight
      of fire is most needed. Slower to displace than the light batteries
      but capable of sustained bombardment.
    recruit_cost: 60
    upkeep_per_turn: 3
    build_time_turns: 2
    men: 0
    weapons: 20

  - name: Siege Artillery Battery
    type: artillery
    description: >-
      Very heavy guns intended to reduce walls, forts, and hardened
      positions. Extremely slow to move and emplace, so they are assigned to
      fixed garrisons or deliberate sieges rather than field operations.
    recruit_cost: 100
    upkeep_per_turn: 5
    build_time_turns: 3
    men: 0
    weapons: 4

  - name: Machine Gun Battery
    type: support_weapons
    description: >-
      Massed repeating-gun crews attached to brigades to anchor a defensive
      line or cover a withdrawal. The clans field these in unusually large
      numbers to compensate for the poor marksmanship of levy infantry.
    recruit_cost: 30
    upkeep_per_turn: 1.5
    build_time_turns: 1
    men: 0
    weapons: 48

  - name: Autocannon Battery
    type: support_weapons
    description: >-
      Rapid-firing light cannon emplaced in fortified positions, used
      against massed infantry assaults and light shipping approaching a
      defended harbor.
    recruit_cost: 50
    upkeep_per_turn: 2.5
    build_time_turns: 2
    men: 0
    weapons: 12
