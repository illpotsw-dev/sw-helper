# Clan McGreggor — Army Order of Battle
#
# Clan McGreggor's formation tree and currently raised units.
# Follows the schema defined in mvp/nations/template/army-oob.yml;
# unit_type values reference mvp/nations/clan-mcgreggor/land-units.yml.
#
# Two independent (parent_id: null) formations:
#   - McGreggor Army (XXXX) — the field army
#   - Portree Garrison (X)  — garrison troops at the city of Portree,
#                             raised by Clan Flannery but held separately
#                             from the field army
#
# Note: artillery, machine gun, and autocannon batteries are tracked by gun
# count only — `men` is 0 for those units by design, not missing data.

formations:
  - id: mcgreggor-army
    parent_id: null
    echelon: XXXX
    name: McGreggor Army

  # --- I. Infantry Division ---
  - id: 1st-infantry-division
    parent_id: mcgreggor-army
    echelon: XX
    name: I. Infantry Division — The Stone Line

  - id: 1st-infantry-brigade
    parent_id: 1st-infantry-division
    echelon: X
    name: 1st Infantry Brigade

  - id: 2nd-infantry-brigade
    parent_id: 1st-infantry-division
    echelon: X
    name: 2nd Infantry Brigade

  - id: 3rd-infantry-brigade
    parent_id: 1st-infantry-division
    echelon: X
    name: 3rd Infantry Brigade

  # --- II. Infantry Division ---
  - id: 2nd-infantry-division
    parent_id: mcgreggor-army
    echelon: XX
    name: II. Infantry Division — Rising Mist

  - id: 4th-infantry-brigade
    parent_id: 2nd-infantry-division
    echelon: X
    name: 4th Infantry Brigade

  - id: 5th-infantry-brigade
    parent_id: 2nd-infantry-division
    echelon: X
    name: 5th Infantry Brigade

  - id: 6th-infantry-brigade
    parent_id: 2nd-infantry-division
    echelon: X
    name: 6th Infantry Brigade

  # --- Divisions holding their units directly, with no brigade layer ---
  - id: cavalry-division
    parent_id: mcgreggor-army
    echelon: XX
    name: Cavalry Division — Woden's Avengers

  - id: mountain-force
    parent_id: mcgreggor-army
    echelon: XX
    name: Mountain Force — The Blood Tithe

  # --- Clan Flannery's field contribution, attached to the McGreggor Army.
  # The source roster gives only a single 5540-man total, so the brigade and
  # battalion breakdown below is generated to fit the tree and should be
  # replaced with Flannery's real organization. ---
  - id: flannery-division
    parent_id: mcgreggor-army
    echelon: XX
    name: Flannery Division

  - id: 1st-flannery-brigade
    parent_id: flannery-division
    echelon: X
    name: 1st Flannery Brigade

  - id: 2nd-flannery-brigade
    parent_id: flannery-division
    echelon: X
    name: 2nd Flannery Brigade

  # --- Independent garrison, not part of the field army ---
  - id: portree-garrison
    parent_id: null
    echelon: X
    name: Portree Garrison

